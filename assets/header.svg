<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Jayden Hindley</title>
  <desc id="desc">Infrastructure, automation and local AI. A dark navy banner with cyan and violet network connections.</desc>
